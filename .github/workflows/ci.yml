name: CI

on:
  push:
    branches: [main, "agent/**", "claude/**"]
  pull_request:
  schedule:
    - cron: "17 2 * * *"   # nightly : galerie de captures
  workflow_dispatch:

env:
  GODOT_VERSION: 4.4.1-stable
  GODOT_TEMPLATES_DIR_NAME: 4.4.1.stable

jobs:
  tests:
    name: Tests (Linux) + captures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pytest shapely pyproj
      - name: Tests Python (contrats, pipeline SIG)
        run: python -m pytest -q qa/unit
      - name: Installer Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          sudo apt-get update && sudo apt-get install -y xvfb libgl1 mesa-utils
      - name: Tests GDScript
        run: |
          godot --headless --path game --import >/dev/null 2>&1 || true
          godot --headless --path game -s ../qa/unit/run_gdscript_tests.gd
      - name: Test réseau (serveur dédié + 2 bots)
        run: bash qa/integration/two_players.sh
      - name: Mission 01 de bout en bout (caisses, conduite, aléas de route, barrage, livraison)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m01_flow.gd -- --no-companions
      - name: Compagnon IA (Gégé charge les 4 caisses seul)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/companion_flow.gd -- --sec=600 --need=4
      - name: Conduite en ligne (serveur + conducteur + spectateur)
        run: bash qa/integration/drive_online.sh
      - name: Mission 02 de bout en bout (pièces, montage, essai, jury, drag)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m02_flow.gd -- --mission=m02 --no-companions
      - name: Mission 02 avec compagnons (Ginette, Kévin, Gégé)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m02_companions.gd -- --mission=m02
      - name: Mission 02 en ligne (le serveur impose la mission)
        run: bash qa/integration/m02_online.sh
      - name: Mission 03 de bout en bout (matériel, trois manches, sabotages, gendarmes, fins ratées)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m03_flow.gd -- --mission=m03 --no-companions
      - name: Mission 03 avec compagnons (Kévin, Ginette, Gégé)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m03_companions.gd -- --mission=m03
      - name: Mission 03 en ligne (le serveur impose la mission)
        run: bash qa/integration/m03_online.sh
      - name: Mission 04 de bout en bout (matériel, feu, chiens, service, bûcher, fins ratées)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m04_flow.gd -- --mission=m04 --no-companions
      - name: Mission 04 avec compagnons (Gégé, Ginette, Kévin)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m04_companions.gd -- --mission=m04
      - name: Mission 04 en ligne (le serveur impose la mission)
        run: bash qa/integration/m04_online.sh
      - name: Mission 05 de bout en bout (troupeau, sifflet, enclos, barrière, temps écoulé)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m05_flow.gd -- --mission=m05 --no-companions
      - name: Mission 05 avec compagnons (Kévin rabat, Ginette guette, Gégé ferme)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m05_companions.gd -- --mission=m05
      - name: Mission 05 en ligne (le serveur impose la mission)
        run: bash qa/integration/m05_online.sh
      - name: Mission 06 de bout en bout (2 km/h, étiquettes, file d'attente, caisse, évincement)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m06_flow.gd -- --mission=m06 --no-companions
      - name: Mission 06 avec compagnons (Gégé fait ses articles, Ginette papote, Kévin attend)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m06_companions.gd -- --mission=m06
      - name: Mission 06 en ligne (le serveur impose la mission)
        run: bash qa/integration/m06_online.sh
      - name: Mission 07 de bout en bout (pression, serrer, crampes, toilettes publiques, clé sous le pot, accident)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m07_flow.gd -- --mission=m07 --no-companions
      - name: Mission 07 avec compagnons (Ginette à la porte, Kévin distrait Mme Hubert, Kévin Radio garde la file)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m07_companions.gd -- --mission=m07
      - name: Mission 07 en ligne (le serveur impose la mission)
        run: bash qa/integration/m07_online.sh
      - name: Mission 08 de bout en bout (oies, voie, train, garde-barrière, tenue, défaite)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m08_flow.gd -- --mission=m08 --no-companions
      - name: Mission 08 avec compagnons (Kévin rassemble, Ginette guette, Gégé rassure)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/m08_companions.gd -- --mission=m08
      - name: Mission 08 en ligne (le serveur impose la mission)
        run: bash qa/integration/m08_online.sh
      - name: HUD des huit missions (jauges et balises valides)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/hud_audit.gd
      - name: Mouvements et collisions (saut, murs, bordures, rampes)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/movement_audit.gd
      - name: Véhicule sur les pentes (montée, crête, descente) et repères un par un
        run: |
          godot --headless --fixed-fps 60 --path game -s ../qa/integration/vehicle_slope_audit.gd
          godot --headless --fixed-fps 60 --path game -s ../qa/integration/focus_audit.gd
      - name: Écran titre et sauvegarde (Continuer, aller-retour disque, sauvegarde corrompue)
        run: godot --headless --path game -s ../qa/integration/menu_save_audit.gd -- --save=/tmp/ouche_menu_test.json
      - name: Choix des touches (remappage, échange, sauvegarde, écran)
        run: godot --headless --path game -s ../qa/integration/controls_audit.gd
      - name: Cinématiques (plans valides, caméra hors des murs, lecture complète)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/integration/cinematic_audit.gd
      - name: Faisabilité des missions (bots et calculs, avec compagnons)
        run: godot --headless --fixed-fps 60 --path game -s ../qa/feasibility/audit.gd -- --companions
      - name: Captures (Compatibility, sans GPU)
        run: bash qa/screenshots/capture.sh "qa/screenshots/out/ci"
      - uses: actions/upload-artifact@v4
        with:
          name: captures-linux-compat
          path: qa/screenshots/out/ci/*.png

  build-windows:
    name: Build Windows
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - name: Installer Godot et les modèles d'export
        shell: bash
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_win64.exe.zip"
          unzip -q godot.zip
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$APPDATA/Godot/export_templates/${GODOT_TEMPLATES_DIR_NAME}"
          unzip -q tpl.tpz -d tpl && mv tpl/templates/* "$APPDATA/Godot/export_templates/${GODOT_TEMPLATES_DIR_NAME}/"
      - name: Exporter
        shell: bash
        run: |
          mkdir -p build/windows
          ./Godot_v${GODOT_VERSION}_win64_console.exe --headless --path game --import || true
          ./Godot_v${GODOT_VERSION}_win64_console.exe --headless --path game --export-release "Windows Desktop"
          test -f build/windows/OucheCity.exe
      - name: Démarrage à vide (solo, 5 s)
        shell: bash
        run: ./Godot_v${GODOT_VERSION}_win64_console.exe --headless --path game -- --solo --quit-after=5 | tee run.log && grep -q "mode=SOLO" run.log
      - uses: actions/upload-artifact@v4
        with: { name: ouche-city-windows, path: build/windows }

  build-macos:
    name: Build macOS (universel, signé si secrets présents)
    needs: tests
    runs-on: macos-latest
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - name: Installer Godot et les modèles d'export
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q godot.zip
          curl -fsSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATES_DIR_NAME}"
          mkdir -p "$DEST" && unzip -q tpl.tpz -d tpl && mv tpl/templates/* "$DEST/"
      - name: Exporter
        run: |
          GODOT="$PWD/Godot.app/Contents/MacOS/Godot"
          mkdir -p build/macos
          "$GODOT" --headless --path game --import || true
          "$GODOT" --headless --path game --export-release "macOS"
          cd build/macos && unzip -q OucheCity.zip && ls
      - name: Démarrage à vide (solo, 5 s)
        run: Godot.app/Contents/MacOS/Godot --headless --path game -- --solo --quit-after=5 | tee run.log && grep -q "mode=SOLO" run.log
      - name: Signer et notariser
        if: env.APPLE_CERT_P12_BASE64 != ''
        run: |
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p ci ci.keychain && security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import cert.p12 -k ci.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          APP="build/macos/Ouche City.app"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_TEAM_ID" "$APP"
          ditto -c -k --keepParent "$APP" build/macos/OucheCity-signed.zip
          xcrun notarytool submit build/macos/OucheCity-signed.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
      - name: Signature ad hoc (secrets Apple absents)
        if: env.APPLE_CERT_P12_BASE64 == ''
        run: |
          echo "::warning::Secrets Apple absents : signature ad hoc seulement (clic droit, Ouvrir, au premier lancement)."
          codesign --force --deep --sign - "build/macos/Ouche City.app"
      - name: Empaqueter (ditto et tar conservent permissions et liens)
        run: |
          cd build/macos
          rm -f OucheCity.zip OucheCity-signed.zip
          ditto -c -k --keepParent "Ouche City.app" OucheCity-mac.zip
          tar -czf OucheCity-mac.tar.gz "Ouche City.app"
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: ouche-city-macos
          path: |
            build/macos/OucheCity-mac.tar.gz
            build/macos/OucheCity-mac.zip

  server-image:
    name: Image Docker du serveur dédié
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - run: docker build -f server/Dockerfile -t ouche-city-server .
